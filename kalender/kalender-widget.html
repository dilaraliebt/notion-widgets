<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Widget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calendar {
            width: 100%;
            max-width: 350px;
            border-radius: 16px;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
        }

        .month-year {
            font-size: 16px;
            font-weight: 600;
        }

        .nav-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .calendar-body {
            padding: 12px 16px 12px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .weekday {
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            padding: 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border-radius: 50%;
            cursor: default;
        }

        .day.other-month { opacity: 0.3; }
        .day.today { font-weight: 600; }

        .today-btn-wrapper {
            display: none;
            justify-content: center;
            padding: 4px 0 0;
        }

        .today-btn {
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 0 0 16px 16px;
            font-family: inherit;
            transition: opacity 0.2s;
            letter-spacing: 0.3px;
            width: 100%;
        }

        .today-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="calendar">
        <div class="header" id="header">
            <button class="nav-btn" id="nav-prev" onclick="changeMonth(-1)">‹</button>
            <span class="month-year" id="month-year"></span>
            <button class="nav-btn" id="nav-next" onclick="changeMonth(1)">›</button>
        </div>
        <div class="calendar-body">
            <div class="weekdays" id="weekdays"></div>
            <div class="days" id="days"></div>
        </div>
        <div class="today-btn-wrapper" id="today-btn-wrapper">
            <button class="today-btn" id="today-btn" onclick="goToToday()">Heute</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const settings = {
            weekStart: 'monday',
            showTodayBtn: params.get('showTodayBtn') === 'true',
            highlightToday: params.get('highlightToday') !== 'false',
            showBorder: params.get('showBorder') === 'true',
            showNavigation: params.get('showNavigation') !== 'false',
            themeColor: params.get('themeColor') || '#F3D6DA',
            headerTextColor: params.get('headerTextColor') || '#FFFFFF',
            dayTextColor: params.get('dayTextColor') || '#2B2B35',
            weekdayTextColor: params.get('weekdayTextColor') || '#7A7380',
            bgColor: params.get('bgColor') || '#FFFFFF',
            darkMode: params.get('darkMode') === 'true'
        };

        // Hintergrund
        document.body.style.background = settings.bgColor;

        // Rahmen
        const calendar = document.querySelector('.calendar');
        if (settings.showBorder) {
            calendar.style.border = `2px solid ${settings.themeColor}`;
        }

        // Header
        const header = document.getElementById('header');
        header.style.background = settings.themeColor;

        const monthYear = document.getElementById('month-year');
        monthYear.style.color = settings.headerTextColor;

        // Navigation
        if (!settings.showNavigation) {
            document.getElementById('nav-prev').style.display = 'none';
            document.getElementById('nav-next').style.display = 'none';
        }

        const navBtns = document.querySelectorAll('.nav-btn');
        navBtns.forEach(btn => {
            btn.style.color = settings.headerTextColor;
            btn.addEventListener('mouseover', () => btn.style.background = 'rgba(255,255,255,0.2)');
            btn.addEventListener('mouseout', () => btn.style.background = 'transparent');
        });

        // Heute-Button
        const todayBtnWrapper = document.getElementById('today-btn-wrapper');
        const todayBtn = document.getElementById('today-btn');
        if (settings.showTodayBtn) {
            todayBtnWrapper.style.display = 'flex';
            todayBtn.style.background = settings.themeColor;
            todayBtn.style.color = settings.headerTextColor;
        }

        // Kalenderdaten
        let currentDate = new Date();

        const months = [
            'Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
            'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'
        ];

        const weekdaysMon = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const today = new Date();

            monthYear.textContent = months[month] + ' ' + year;

            const weekdaysEl = document.getElementById('weekdays');
            weekdaysEl.innerHTML = weekdaysMon.map(d =>
                `<div class="weekday" style="color: ${settings.weekdayTextColor}">${d}</div>`
            ).join('');

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            let startDayOfWeek = firstDay.getDay();
            startDayOfWeek = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;

            const daysEl = document.getElementById('days');
            let html = '';

            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                html += `<div class="day other-month" style="color: ${settings.dayTextColor}">${prevMonthLastDay - i}</div>`;
            }

            for (let day = 1; day <= lastDay.getDate(); day++) {
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                let style = `color: ${settings.dayTextColor}`;
                if (isToday && settings.highlightToday) {
                    style = `background: ${settings.themeColor}; color: ${settings.headerTextColor}`;
                }
                html += `<div class="day${isToday ? ' today' : ''}" style="${style}">${day}</div>`;
            }

            const totalCells = Math.ceil((startDayOfWeek + lastDay.getDate()) / 7) * 7;
            const remaining = totalCells - (startDayOfWeek + lastDay.getDate());
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="day other-month" style="color: ${settings.dayTextColor}">${i}</div>`;
            }

            daysEl.innerHTML = html;
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
