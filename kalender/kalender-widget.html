<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calendar {
            width: 100%;
            max-width: 350px;
        }

        /* === CLASSIC STYLE === */
        .header-classic {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-year-classic {
            font-size: 18px;
            font-weight: 600;
        }

        .nav-buttons-classic {
            display: flex;
            gap: 8px;
        }

        .nav-btn-classic {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .today-btn-classic {
            margin-bottom: 15px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        
        /* === MODERN STYLE === */
        .header-modern {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px 16px 0 0;
            overflow: hidden;
        }

        .month-year-modern {
            font-size: 18px;
            font-weight: 600;
        }

        .nav-btn-modern {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            background: transparent;
            transition: background 0.2s;
        }

        .today-btn-wrapper-modern {
            display: none;
            justify-content: center;
            margin-top: 15px;
            padding-bottom: 20px;
        }

        .today-btn-modern {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .today-btn-modern:hover { opacity: 0.8; }

        /* === GEMEINSAM === */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .weekday {
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            padding: 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border-radius: 50%;
            cursor: default;
        }

        .day.other-month { opacity: 0.3; }
        .day.today { font-weight: 600; }

    </style>
</head>
<body>
    <div class="calendar" id="calendar">
        <!-- Header wird per JS gerendert -->
        <div id="header-container"></div>
        <div id="calendar-grid">
            <div class="weekdays" id="weekdays"></div>
            <div class="days" id="days"></div>
        </div>
        <div class="today-btn-wrapper" id="today-btn-wrapper">
            <button class="today-btn" id="today-btn" onclick="goToToday()">Heute</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const settings = {
            style: params.get('style') || 'classic',
            weekStart: 'monday',
            showTodayBtn: params.get('showTodayBtn') === 'true',
            highlightToday: params.get('highlightToday') !== 'false',
            showBorder: params.get('showBorder') === 'true',
            showNavigation: params.get('showNavigation') !== 'false',
            themeColor: params.get('themeColor') || '#F3D6DA',
            headerTextColor: params.get('headerTextColor') || '#37352F',
            dayTextColor: params.get('dayTextColor') || '#37352F',
            weekdayTextColor: params.get('weekdayTextColor') || '#718096',
            bgColor: params.get('bgColor') || '#FFFFFF',
            darkMode: params.get('darkMode') === 'true'
        };

        document.body.style.background = settings.bgColor;

        const calendar = document.getElementById('calendar');

        // Rahmen
        if (settings.showBorder) {
            calendar.style.border = `2px solid ${settings.themeColor}`;
            calendar.style.borderRadius = '16px';
            calendar.style.padding = '20px';
        }

        // Header je nach Stil rendern
        const headerContainer = document.getElementById('header-container');

        if (settings.style === 'modern') {
            calendar.style.borderRadius = settings.showBorder ? '16px' : '16px';
            calendar.style.overflow = 'hidden';
            headerContainer.innerHTML = `
                <div class="header-modern" id="header" style="background: ${settings.themeColor}; padding: 10px 16px;">
                    <button class="nav-btn-modern" onclick="changeMonth(-1)" style="color: ${settings.headerTextColor};">‹</button>
                    <span class="month-year-modern" id="month-year" style="color: ${settings.headerTextColor};"></span>
                    <button class="nav-btn-modern" onclick="changeMonth(1)" style="color: ${settings.headerTextColor};">›</button>
                </div>
            `;
            document.getElementById('calendar-grid').style.padding = '20px 20px 0';

            document.querySelectorAll('.nav-btn-modern').forEach(btn => {
                btn.addEventListener('mouseover', () => btn.style.background = 'rgba(255,255,255,0.2)');
                btn.addEventListener('mouseout', () => btn.style.background = 'transparent');
            });

        } else {
            // Classic
            headerContainer.innerHTML = `
                <div class="header-classic" id="header">
                    <span class="month-year-classic" id="month-year" style="color: ${settings.headerTextColor};"></span>
                    <div class="nav-buttons-classic" id="nav-buttons" style="display: ${settings.showNavigation ? 'flex' : 'none'};">
                        <button class="nav-btn-classic" onclick="changeMonth(-1)" style="background: ${settings.themeColor}22; color: ${settings.headerTextColor};">‹</button>
                        <button class="nav-btn-classic" onclick="changeMonth(1)" style="background: ${settings.themeColor}22; color: ${settings.headerTextColor};">›</button>
                    </div>
                </div>
            `;

            document.querySelectorAll('.nav-btn-classic').forEach(btn => {
                btn.addEventListener('mouseover', () => btn.style.background = settings.themeColor + '44');
                btn.addEventListener('mouseout', () => btn.style.background = settings.themeColor + '22');
            });
        }

        // Navigation für Modern ausblenden
        if (settings.style === 'modern' && !settings.showNavigation) {
            document.querySelectorAll('.nav-btn-modern').forEach(btn => btn.style.display = 'none');
        }

        // Heute-Button
        const todayBtnWrapper = document.getElementById('today-btn-wrapper');
        const todayBtn = document.getElementById('today-btn');
        if (settings.showTodayBtn) {
            todayBtnWrapper.style.display = 'flex';
            todayBtn.style.background = settings.themeColor;
            todayBtn.style.color = settings.style === 'modern' ? settings.headerTextColor : (settings.darkMode ? '#191919' : '#FFFFFF');
        }

        let currentDate = new Date();

        const months = [
            'Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
            'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'
        ];

        const weekdays = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const today = new Date();

            document.getElementById('month-year').textContent = months[month] + ' ' + year;

            document.getElementById('weekdays').innerHTML = weekdays.map(d =>
                `<div class="weekday" style="color: ${settings.weekdayTextColor}">${d}</div>`
            ).join('');

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            let startDayOfWeek = firstDay.getDay();
            startDayOfWeek = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;

            let html = '';

            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                html += `<div class="day other-month" style="color: ${settings.dayTextColor}">${prevMonthLastDay - i}</div>`;
            }

            for (let day = 1; day <= lastDay.getDate(); day++) {
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                let style = `color: ${settings.dayTextColor}`;
                if (isToday && settings.highlightToday) {
                    const todayTextColor = settings.style === 'modern' ? settings.headerTextColor : (settings.darkMode ? '#191919' : '#FFFFFF');
                    style = `background: ${settings.themeColor}; color: ${todayTextColor}`;
                }
                html += `<div class="day${isToday ? ' today' : ''}" style="${style}">${day}</div>`;
            }

            const totalCells = Math.ceil((startDayOfWeek + lastDay.getDate()) / 7) * 7;
            const remaining = totalCells - (startDayOfWeek + lastDay.getDate());
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="day other-month" style="color: ${settings.dayTextColor}">${i}</div>`;
            }

            document.getElementById('days').innerHTML = html;
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
